name: Verificar composicoes Remotion
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'package.json', 'tsconfig.json', 'scripts/render-stills.mjs', '.github/workflows/validate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remotion-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - run: node scripts/render-stills.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: revisao-visual-remotion
          path: out/review/
          retention-days: 14
